<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille appels d'offres</title>
<!--
  Page de suivi des annonces retenues par la pipeline, réunies dans un seul
  tableau (colonne « Source ») : BOAMP (table annonces_boamp), TED (table
  annonces_ted), Simap (table annonces_simap, appels d'offres suisses),
  PLACE (table annonces_place, alertes mail de marches-publics.gouv.fr) et
  AWS (table annonces_aws, alertes mail de marches-publics.info). Chaque source est décrite dans SOURCES (table,
  colonnes, lecture de ses champs) ; le reste est commun.
  Onglet « Veille ciblée » : relevés de la veille des profils acheteurs (table
  veille_profils : Dematis, achatpublic, sites d'institutions), case « Vue » par profil.
  Onglet « Statistiques » : par jour, annonces collectées, sélectionnées
  (envoyées au LLM) et retenues (affichées), en barres empilées pour
  l'ensemble des sources puis pour chacune (vue statistiques_quotidiennes).

  Lit directement les tables dans Supabase (aucune régénération quotidienne) :
  annonces marquées `rapporte` dont la note LLM est absente ou strictement
  positive, plus celles déjà notées par l'équipe, même si elles ne passent plus
  le filtre.
  Seules les colonnes `vue` et `note_humaine` sont modifiables depuis la page
  (droits par colonne + RLS côté Supabase, rôle authenticated uniquement).

  La clé anon/publishable (app.js) est publique par conception : sans
  connexion, elle ne donne accès à rien. Styles dans style.css, code dans app.js.
-->
<link rel="stylesheet" href="style.css?v=11">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<form id="connexion" hidden>
  <h1>Veille appels d'offres</h1>
  <div class="sous-titre">reciproque — accès réservé</div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="mot-de-passe">Mot de passe</label>
  <input id="mot-de-passe" type="password" autocomplete="current-password" required>
  <button type="submit">Se connecter</button>
  <div class="erreur" id="erreur-connexion"></div>
</form>

<main id="application" hidden>
  <div class="entete">
    <h1>Veille appels d'offres — reciproque</h1>
    <div class="utilisateur"><span id="email-utilisateur"></span> · <button id="deconnexion" type="button">Se déconnecter</button></div>
  </div>
  <div class="onglets" role="tablist">
    <button type="button" role="tab" data-onglet="annonces">Appels d'offres</button>
    <button type="button" role="tab" data-onglet="veille-ciblee">Veille ciblée</button>
    <button type="button" role="tab" data-onglet="statistiques">Statistiques</button>
  </div>

  <section id="onglet-annonces">
  <div class="nouveautes" id="nouveautes"></div>
  <div class="sous-titre" id="compteur">Chargement…</div>

  <div class="filtres">
    <label><input type="checkbox" id="masquer-vues"> Masquer les annonces vues</label>
    <label><input type="checkbox" id="masquer-expirees" checked> Masquer les annonces dont la date limite est passée</label>
    <label>Publiées depuis le <input type="date" id="depuis"></label>
    <label><input type="search" id="recherche" placeholder="Rechercher (objet, acheteur…)"></label>
    <button type="button" id="reinitialiser" title="Remet à zéro les filtres et le tri des colonnes du tableau">Réinitialiser les filtres</button>
  </div>

  <div class="conteneur-tableau">
    <table>
      <thead><tr id="entetes"></tr></thead>
      <tbody id="lignes"></tbody>
    </table>
  </div>
  </section>

  <section id="onglet-veille-ciblee" hidden>
  <div class="sous-titre" id="compteur-veille">Chargement…</div>
  <div class="conteneur-tableau">
    <table class="tableau-veille">
      <thead><tr>
        <th class="col-vue-profil">Vue</th>
        <th>Institution</th>
        <th>Ville</th>
        <th>Plateforme</th>
        <th>Offres en cours</th>
        <th class="col-nouveautes">Nouveautés</th>
        <th>Dernière vérification</th>
      </tr></thead>
      <tbody id="lignes-veille"></tbody>
    </table>
  </div>
  </section>

  <section id="onglet-statistiques" hidden>
  <div class="sous-titre" id="compteur-statistiques">Chargement…</div>
  <div class="legende-statistiques">
    <span><span class="carre" style="background:#86b6ef"></span>Collectées</span>
    <span><span class="carre" style="background:#2a78d6"></span>Sélectionnées (envoyées au LLM)</span>
    <span><span class="carre" style="background:#104281"></span>Retenues (affichées)</span>
  </div>
  <div id="graphiques-statistiques"></div>
  <details class="chiffres-statistiques">
    <summary>Voir les chiffres</summary>
    <div class="conteneur-tableau">
      <table class="tableau-statistiques">
        <thead id="entetes-statistiques"></thead>
        <tbody id="lignes-statistiques"></tbody>
      </table>
    </div>
  </details>
  <div id="infobulle-statistiques" class="infobulle" hidden></div>
  </section>
</main>

<script src="app.js?v=17"></script>
</body>
</html>
